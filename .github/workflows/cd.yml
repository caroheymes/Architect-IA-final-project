name: CD — Deploy Staging

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lyonflow

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Push images vers GHCR
  # ──────────────────────────────────────────────
  build-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image-suffix: app
          - dockerfile: Dockerfile.ray
            image-suffix: ray
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-suffix }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 2. Tag sémantique automatique
  # ──────────────────────────────────────────────
  tag:
    name: Auto-tag version
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          DRY_RUN: false

  # ──────────────────────────────────────────────
  # 3. Deploy Kubernetes staging
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy K8s staging
    runs-on: ubuntu-latest
    needs: [build-push, tag]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "::error::The secret KUBE_CONFIG_STAGING is empty or not configured in your GitHub repository secrets!"
            echo "Please go to Settings > Secrets and variables > Actions in your GitHub repository and add KUBE_CONFIG_STAGING."
            exit 1
          fi
          
          # Try decoding from base64. If it contains apiVersion, write it. Otherwise, try plain text.
          DECODED=$(echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d 2>/dev/null || true)
          if echo "$DECODED" | grep -q "apiVersion:"; then
            echo "$DECODED" > $HOME/.kube/config
            echo "Success: Kubeconfig decoded from Base64."
          elif echo "${{ secrets.KUBE_CONFIG_STAGING }}" | grep -q "apiVersion:"; then
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" > $HOME/.kube/config
            echo "Success: Kubeconfig written as plain text."
          else
            echo "::error::The KUBE_CONFIG_STAGING secret does not seem to contain a valid Kubeconfig (missing apiVersion:)."
            exit 1
          fi
          chmod 600 $HOME/.kube/config

      - name: Update image tags in manifests
        run: |
          COMMIT_SHA=${GITHUB_SHA::7}
          for f in kubernetes/*.yaml; do
            sed -i "s|image: rayproject/ray:2.35.0-py312|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ray:${COMMIT_SHA}|g" "$f"
            sed -i "s|image: postgres:15-alpine|image: postgres:15-alpine|g" "$f"
          done

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/secrets-template.yaml
          kubectl apply -f kubernetes/postgres-deployment.yaml
          kubectl apply -f kubernetes/mlflow-deployment.yaml
          kubectl apply -f kubernetes/ray-cluster-deployment.yaml
          kubectl apply -f kubernetes/airflow-deployment.yaml
          kubectl apply -f kubernetes/streamlit-deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl rollout status deployment/ray-head --timeout=120s

  # ──────────────────────────────────────────────
  # 4. Smoke tests
  # ──────────────────────────────────────────────
  smoke-test:
    name: Smoke tests staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "::error::The secret KUBE_CONFIG_STAGING is empty or not configured in your GitHub repository secrets!"
            echo "Please go to Settings > Secrets and variables > Actions in your GitHub repository and add KUBE_CONFIG_STAGING."
            exit 1
          fi
          
          # Try decoding from base64. If it contains apiVersion, write it. Otherwise, try plain text.
          DECODED=$(echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d 2>/dev/null || true)
          if echo "$DECODED" | grep -q "apiVersion:"; then
            echo "$DECODED" > $HOME/.kube/config
            echo "Success: Kubeconfig decoded from Base64."
          elif echo "${{ secrets.KUBE_CONFIG_STAGING }}" | grep -q "apiVersion:"; then
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" > $HOME/.kube/config
            echo "Success: Kubeconfig written as plain text."
          else
            echo "::error::The KUBE_CONFIG_STAGING secret does not seem to contain a valid Kubeconfig (missing apiVersion:)."
            exit 1
          fi
          chmod 600 $HOME/.kube/config

      - name: Healthcheck PostgreSQL
        run: |
          kubectl exec deployment/postgres -- pg_isready -U lyonflow -d lyonflow
          echo "PostgreSQL is healthy"

      - name: Healthcheck Airflow
        run: |
          kubectl exec deployment/airflow-webserver -- airflow version
          echo "Airflow webserver is healthy"

      - name: Healthcheck Ray
        run: |
          kubectl exec deployment/ray-head -- ray status
          echo "Ray cluster is healthy"

      - name: Verify DAG loaded
        run: |
          kubectl exec deployment/airflow-scheduler -- airflow dags list | grep lyonflow_traffic_pipeline
          echo "DAG lyonflow_traffic_pipeline is registered"
