name: CI — Tests & Qualité

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint Python (ruff)
  # ──────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ──────────────────────────────────────────────
  # 2. Type-check (mypy)
  # ──────────────────────────────────────────────
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy
          pip install -r requirements.txt
          pip install apache-airflow==2.9.1

      - name: Run mypy
        continue-on-error: true
        run: mypy dags/ training/ utils/ app.py --ignore-missing-imports --namespace-packages --explicit-package-bases

  # ──────────────────────────────────────────────
  # 3. Tests unitaires (pytest)
  # ──────────────────────────────────────────────
  tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apache-airflow==2.9.1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric

      - name: Run pytest
        run: pytest tests/ -v --tb=short --junitxml=reports/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit.xml

  # ──────────────────────────────────────────────
  # 4. Build Docker images
  # ──────────────────────────────────────────────
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, tests]
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image-name: lyonflow-app
          - dockerfile: Dockerfile.ray
            image-name: lyonflow-ray
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image-name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image-name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 5. Scan sécurité (Trivy)
  # ──────────────────────────────────────────────
  security-scan:
    name: Scan sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image-name: lyonflow-app
          - dockerfile: Dockerfile.ray
            image-name: lyonflow-ray
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image-name }}:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image-name }}:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-${{ matrix.image-name }}.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.image-name }}
          path: trivy-${{ matrix.image-name }}.txt
