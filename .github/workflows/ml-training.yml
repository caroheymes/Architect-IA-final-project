name: ML — Entraînement Champion

on:
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Nombre de trials HPO Optuna"
        required: false
        default: "20"
      mae_threshold:
        description: "Seuil MAE (km/h) pour promotion du modèle"
        required: false
        default: "5.0"
      skip_hpo:
        description: "Sauter HPO et utiliser les meilleurs params existants"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 0"  # Dimanche 3h du matin

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Tests modèle STGCN
  # ──────────────────────────────────────────────
  test-model:
    name: Tests STGCN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric

      - name: Run STGCN model tests
        run: pytest tests/test_stgcn_model.py -v --tb=short

  # ──────────────────────────────────────────────
  # 2. Export données Gold → CSV
  # ──────────────────────────────────────────────
  export-data:
    name: Export Gold → CSV
    runs-on: self-hosted
    needs: [test-model]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install sqlalchemy psycopg2-binary pandas

      - name: Export Gold layer to CSV
        run: |
          export DATA_FOLDER=data/in
          export SEQ_LEN_EXPORT=150
          python utils/export_db_to_csv.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gold-csv-export
          path: data/in/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. HPO Optuna (conditionnel)
  # ──────────────────────────────────────────────
  hpo:
    name: HPO Optuna (${{ inputs.n_trials || '20' }} trials)
    runs-on: [self-hosted, gpu]
    needs: [export-data]
    if: ${{ !inputs.skip_hpo }}
    steps:
      - uses: actions/checkout@v4

      - name: Download CSV data
        uses: actions/download-artifact@v4
        with:
          name: gold-csv-export
          path: data/in/

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cu121
          pip install torch-geometric
          pip install optuna optuna-dashboard

      - name: Run Bayesian HPO
        working-directory: training/stgcn
        run: |
          export USE_LOCAL_CSV=true
          export DATA_FOLDER=${{ github.workspace }}/data/in
          python hpo_stgcn.py
        env:
          N_TRIALS: ${{ inputs.n_trials || '20' }}

      - name: Extract best hyperparameters
        id: best-params
        working-directory: training/stgcn
        run: |
          python get_best_params.py > best_params.sh
          cat best_params.sh
          source best_params.sh

      - name: Upload HPO results
        uses: actions/upload-artifact@v4
        with:
          name: hpo-results
          path: training/stgcn/best_params.sh

  # ──────────────────────────────────────────────
  # 4. Train Champion
  # ──────────────────────────────────────────────
  train-champion:
    name: Train Champion STGCN
    runs-on: [self-hosted, gpu]
    needs: [hpo]
    if: ${{ always() && needs.export-data.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download CSV data
        uses: actions/download-artifact@v4
        with:
          name: gold-csv-export
          path: data/in/

      - name: Download HPO results (if available)
        if: ${{ needs.hpo.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: hpo-results
          path: hpo/

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cu121
          pip install torch-geometric
          pip install mlflow matplotlib

      - name: Load best hyperparameters
        run: |
          if [ -f hpo/best_params.sh ]; then
            echo "Loading HPO best params..."
            source hpo/best_params.sh
          else
            echo "Using default params..."
            export SEQ_LEN=120
            export BATCH_SIZE=2
            export HIDDEN_CHANNELS=128
            export LEARNING_RATE=0.001
          fi

      - name: Train STGCN Champion
        working-directory: training/stgcn
        run: |
          export USE_LOCAL_CSV=true
          export DATA_FOLDER=${{ github.workspace }}/data/in
          export EPOCHS=100
          export HORIZONS="6,12,36"
          python train_stgcn.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: champion-model
          path: |
            models/stgcn_prod_latest.pt
            models/stgcn_scaler.pkl
            models/stratified_error_analysis.png
            models/stratified_error_analysis.csv

  # ──────────────────────────────────────────────
  # 5. Évaluation & Promotion
  # ──────────────────────────────────────────────
  promote:
    name: Évaluation & Promotion
    runs-on: ubuntu-latest
    needs: [train-champion]
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: champion-model
          path: models/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Evaluate MAE threshold
        id: evaluate
        run: |
          pip install pandas
          python -c "
          import pandas as pd
          import sys

          df = pd.read_csv('models/stratified_error_analysis.csv')
          global_mae = df['MAE (km/h)'].mean()
          threshold = float('${{ inputs.mae_threshold || 5.0 }}')

          print(f'Global MAE: {global_mae:.4f} km/h')
          print(f'Threshold:  {threshold:.4f} km/h')

          if global_mae <= threshold:
              print('PASS — Model promoted')
              with open('${{ github.output }}', 'a') as f:
                  f.write(f'promoted=true\n')
                  f.write(f'mae={global_mae:.4f}\n')
          else:
              print(f'FAIL — MAE {global_mae:.4f} exceeds threshold {threshold}')
              with open('${{ github.output }}', 'a') as f:
                  f.write(f'promoted=false\n')
                  f.write(f'mae={global_mae:.4f}\n')
              sys.exit(1)
          "

      - name: Create GitHub Release
        if: steps.evaluate.outputs.promoted == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-v${{ github.run_number }}
          name: "Champion STGCN v${{ github.run_number }} (MAE: ${{ steps.evaluate.outputs.mae }} km/h)"
          body: |
            ## Champion Model Release

            - **MAE globale** : ${{ steps.evaluate.outputs.mae }} km/h
            - **Horizons** : 30min, 1h, 3h
            - **Architecture** : ST-GRU-GNN (GRU + 2×GCNConv + skip connections)
            - **Entraîné le** : ${{ github.event.head_commit.timestamp || 'schedule' }}
          files: |
            models/stgcn_prod_latest.pt
            models/stgcn_scaler.pkl
            models/stratified_error_analysis.png
            models/stratified_error_analysis.csv

      - name: Upload analysis plot as summary
        if: always()
        run: |
          echo "## Analyse d'erreur stratifiée" >> $GITHUB_STEP_SUMMARY
          echo "![Stratified Error Analysis](models/stratified_error_analysis.png)" >> $GITHUB_STEP_SUMMARY
