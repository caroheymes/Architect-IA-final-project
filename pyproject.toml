[project]
name = "lyonflow"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["logs/", "data/", "models/", "plugins/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "F401",   # unused imports — too noisy on initial adoption
    "E402",   # module-level import not at top — needed for sys.path hacks in tests
    "B905",   # zip without strict — not critical
]

[tool.ruff.lint.isort]
known-first-party = ["dags", "training", "utils"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
exclude = ["logs/", "data/", "models/", "plugins/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_ingest.py", "test_transform.py", "test_stgcn_model.py", "test_migrate_historical.py"]
addopts = "-v --tb=short"
