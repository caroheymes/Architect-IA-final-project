[project]
name = "lyonflow"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["logs/", "data/", "models/", "plugins/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "F401",   # unused imports — too noisy on initial adoption
    "E402",   # module-level import not at top — needed for sys.path hacks in tests
    "B905",   # zip without strict — not critical
    "W291",   # trailing whitespace in SQL multiline strings — not auto-fixable
    "W293",   # blank line contains whitespace in SQL strings — same reason
    "B904",   # raise from in except — too invasive for existing code
    "B006",   # mutable default argument — false positive on list defaults
    "B007",   # unused loop variable — common pattern with enumerate
    "F841",   # unused variable — max_i/max_j kept for readability
    "E712",   # comparison to False — pandas filter pattern
]

[tool.ruff.lint.isort]
known-first-party = ["dags", "training", "utils"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
exclude = ["logs/", "data/", "models/", "plugins/", "tests/", "utils/old_sans_interet/"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_ingest.py", "test_transform.py", "test_stgcn_model.py", "test_migrate_historical.py"]
addopts = "-v --tb=short"

[tool.ruff.format]
line-ending = "lf"
