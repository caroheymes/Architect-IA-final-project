apiVersion: v1
kind: Service
metadata:
  name: ray-head
  namespace: default
spec:
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
    - name: client
      port: 10001
      targetPort: 10001
    - name: gcs
      port: 6379
      targetPort: 6379
  selector:
    app: ray-head
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
    spec:
      containers:
        - name: ray-head
          image: rayproject/ray:2.35.0-py312
          ports:
            - containerPort: 8265
            - containerPort: 10001
            - containerPort: 6379
          env:
            - name: API_LOGIN
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: API_LOGIN
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: API_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: "postgres"
          command: ["sh", "-c"]
          args: ["ray start --head --port=6379 --dashboard-host=0.0.0.0 --block"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ray-worker
  template:
    metadata:
      labels:
        app: ray-worker
    spec:
      containers:
        - name: ray-worker
          image: rayproject/ray:2.35.0-py312
          env:
            - name: API_LOGIN
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: API_LOGIN
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: API_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lyonflow-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: "postgres"
          command: ["sh", "-c"]
          args: ["ray start --address=ray-head:6379 --block"]
